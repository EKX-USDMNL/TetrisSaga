<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#e0e0e0;font-family:'Inter',Arial,Helvetica,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow-x:hidden;overflow-y:auto}
#bgCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
body>*:not(#bgCanvas){position:relative;z-index:1}

h1{margin-top:24px;font-size:2.4rem;font-weight:900;letter-spacing:6px;text-transform:uppercase;color:#00d4ff;background:linear-gradient(135deg,#00d4ff,#7b2ff7,#ff2d95);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}

/* ── Volume ── */
#volumeWrap{position:fixed;top:14px;right:18px;z-index:100;display:flex;align-items:center;gap:8px;background:rgba(10,10,26,.85);border:1px solid #333;border-radius:8px;padding:6px 14px;backdrop-filter:blur(6px)}
#volumeWrap label{font-size:.72rem;color:#bbb;letter-spacing:1px;font-weight:600}
#volSlider{-webkit-appearance:none;width:90px;height:4px;border-radius:2px;background:#333;outline:none}
#volSlider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#00d4ff;cursor:pointer}
#volSlider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#00d4ff;cursor:pointer;border:none}
#muteBtn{background:none;border:none;color:#888;font-size:1.1rem;cursor:pointer;padding:0 2px}
#muteBtn:hover{color:#fff}

/* ── Menu ── */
#menu{margin-top:36px;display:flex;flex-direction:column;align-items:center;gap:14px}
#menu button{width:280px;padding:14px 0;font-size:1.05rem;font-weight:700;letter-spacing:2px;border:none;border-radius:8px;cursor:pointer;transition:transform .15s,box-shadow .15s}
#menu button:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(0,212,255,.35)}
.btn-solo{background:linear-gradient(135deg,#00d4ff,#0070f2);color:#fff}
.btn-local{background:linear-gradient(135deg,#7b2ff7,#b44dff);color:#fff}
.btn-online{background:linear-gradient(135deg,#ff2d95,#ff6b00);color:#fff}
.btn-continue{background:linear-gradient(135deg,#00e676,#00bfa5);color:#fff}
.btn-delete-save{background:none;border:1px solid #444 !important;color:#888;font-size:.82rem !important;padding:8px 16px !important;width:auto !important;letter-spacing:1px !important}
.btn-delete-save:hover{border-color:#ff2d55 !important;color:#ff2d55 !important}
.menu-sep{width:220px;height:1px;background:#222;margin:4px 0}

/* ── Name entry (local) ── */
#nameEntry{display:none;margin-top:36px;flex-direction:column;align-items:center;gap:14px}
#nameEntry .ne-title{font-size:1.1rem;font-weight:700;letter-spacing:2px;color:#ccc}
.name-row{display:flex;gap:10px;align-items:center}
.name-row label{font-size:.85rem;font-weight:600;color:#bbb;min-width:70px;text-align:right}
.name-input{width:180px;padding:9px 12px;font-size:.95rem;font-weight:600;background:#111;border:1px solid #444;border-radius:6px;color:#fff;outline:none;letter-spacing:1px}
.name-input:focus{border-color:#00d4ff}
.name-input::placeholder{color:#444;font-weight:400}
#nameEntry button{width:240px;padding:12px 0;font-size:.95rem;font-weight:700;letter-spacing:2px;border:none;border-radius:8px;cursor:pointer;transition:transform .15s}
#nameEntry button:hover{transform:scale(1.04)}

/* ── Lobby ── */
#lobby{display:none;margin-top:32px;flex-direction:column;align-items:center;gap:14px;max-width:340px}
#lobby .lobby-title{font-size:1.1rem;font-weight:700;letter-spacing:2px;color:#ccc}
#lobby button{width:240px;padding:12px 0;font-size:.95rem;font-weight:700;letter-spacing:1px;border:none;border-radius:8px;cursor:pointer;transition:transform .15s}
#lobby button:hover{transform:scale(1.04)}
.btn-create{background:linear-gradient(135deg,#00d4ff,#0070f2);color:#fff}
.btn-join{background:linear-gradient(135deg,#ff2d95,#ff6b00);color:#fff}
.btn-start{background:linear-gradient(135deg,#00e676,#00bfa5);color:#fff}
.btn-back-sm{background:#222;color:#ccc;border:1px solid #444 !important}
#lobbyStatus{margin-top:4px;text-align:center;min-height:40px}
#lobbyStatus .code-display{font-size:2rem;font-weight:900;letter-spacing:8px;color:#00d4ff;margin:6px 0}
#lobbyStatus .hint{font-size:.82rem;color:#aaa}
#playerList{text-align:center;font-size:1.1rem;color:#bbb;line-height:1.9}
#playerList .host-tag{color:#00d4ff;font-weight:600;font-size:.85rem;margin-left:6px}
#joinInput{width:200px;padding:10px 14px;font-size:1.1rem;font-weight:700;letter-spacing:4px;text-align:center;background:#111;border:1px solid #444;border-radius:6px;color:#fff;outline:none}
#joinInput:focus{border-color:#00d4ff}
#joinInput::placeholder{color:#444;letter-spacing:2px;font-weight:400}
#onlineNameInput{width:240px;padding:10px 14px;font-size:.95rem;font-weight:600;text-align:center;background:#111;border:1px solid #444;border-radius:6px;color:#fff;outline:none;letter-spacing:1px;margin-bottom:4px}
#onlineNameInput:focus{border-color:#00d4ff}
#onlineNameInput::placeholder{color:#444;font-weight:400;letter-spacing:0}

/* ── Game area ── */
#gameArea{display:none;margin-top:20px;flex-direction:row;gap:28px;justify-content:center;flex-wrap:wrap}
.player-section{display:flex;flex-direction:column;align-items:center;gap:6px}
.player-label{font-size:.9rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#ccc}
.player-label.you{color:#00d4ff}
.player-label.opponent{color:#ff2d95}
.board-wrap{position:relative;border:2px solid #333;border-radius:6px;overflow:hidden;background:#111}
.board-wrap canvas{display:block}
.side-panel{display:flex;flex-direction:row;gap:18px;align-items:flex-start}
.info-col{display:flex;flex-direction:column;gap:4px;min-width:90px}
.info-col .label{font-size:.7rem;color:#aaa;letter-spacing:1px;text-transform:uppercase}
.info-col .value{font-size:1.3rem;font-weight:700;color:#fff}
.next-box{display:flex;flex-direction:column;align-items:center;gap:2px}
.next-box .label{font-size:.7rem;color:#aaa;letter-spacing:1px;text-transform:uppercase}
.next-box canvas{border:1px solid #222;border-radius:4px;background:#0d0d1a}

/* ── Overlays ── */
.overlay{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,.75);z-index:10;pointer-events:none}
.overlay.active{display:flex}
.overlay span{font-size:1.3rem;font-weight:900;letter-spacing:3px;color:#ff2d95}
.overlay .win{color:#00e676}
.overlay .sub{font-size:.78rem;color:#aaa;margin-top:6px;font-weight:400;letter-spacing:1px}
.pause-banner{position:absolute;inset:0;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.65);z-index:11;pointer-events:none}
.pause-banner.active{display:flex}
.pause-banner span{font-size:1.2rem;font-weight:900;letter-spacing:4px;color:#00d4ff}

/* ── Toolbar ── */
#toolbar{margin-top:16px;margin-bottom:10px;display:none;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
#toolbar button{padding:9px 22px;font-size:.85rem;font-weight:600;letter-spacing:1px;border:1px solid #444;border-radius:6px;cursor:pointer;transition:background .15s,border-color .15s}
.tb-pause{background:#1a1a2e;color:#00d4ff;border-color:#00d4ff !important}
.tb-pause:hover{background:#00d4ff22}
.tb-save{background:#1a1a2e;color:#00e676;border-color:#00e676 !important}
.tb-save:hover{background:#00e67622}
.tb-back{background:#222;color:#ccc}
.tb-back:hover{background:#333}
#pauseInfo{font-size:.78rem;color:#bbb;letter-spacing:1px;font-weight:600}

/* ── Controls legend ── */
#controls{margin-top:10px;padding:14px 24px;border:1px solid #222;border-radius:8px;background:#111;display:none;gap:28px;justify-content:center;flex-wrap:wrap}
.ctrl-group{display:flex;flex-direction:column;gap:3px}
.ctrl-group .ctrl-title{font-weight:700;font-size:.78rem;color:#bbb;letter-spacing:1px;margin-bottom:3px}
.ctrl-group .ctrl-row{display:flex;gap:6px;align-items:center;font-size:.76rem;color:#ddd}
kbd{display:inline-block;padding:2px 6px;border:1px solid #444;border-radius:4px;background:#1a1a2e;font-family:'Inter',monospace;font-size:.72rem;color:#ddd}

/* ── Diagnostics Panel ── */
#diagToggle{position:fixed;top:14px;left:18px;z-index:200;background:rgba(10,10,26,.9);border:1px solid #444;border-radius:8px;padding:6px 12px;color:#aaa;font-size:.72rem;font-weight:600;letter-spacing:1px;cursor:pointer;backdrop-filter:blur(6px);transition:border-color .2s}
#diagToggle:hover{border-color:#00d4ff;color:#fff}
#diagPanel{position:fixed;top:44px;left:18px;z-index:200;width:420px;max-height:calc(100vh - 60px);background:rgba(8,8,20,.95);border:1px solid #333;border-radius:10px;backdrop-filter:blur(8px);display:none;flex-direction:column;overflow:hidden;font-size:.75rem;color:#ccc}
#diagPanel.open{display:flex}
#diagHeader{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #222}
#diagHeader span{font-weight:700;letter-spacing:2px;color:#00d4ff;font-size:.78rem}
#diagBtnRow{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid #222;flex-wrap:wrap}
#diagBtnRow button{padding:5px 12px;font-size:.7rem;font-weight:600;letter-spacing:.5px;border:1px solid #444;border-radius:5px;cursor:pointer;background:#1a1a2e;color:#ccc;transition:all .15s}
#diagBtnRow button:hover{border-color:#00d4ff;color:#fff}
#diagBtnRow button.running{border-color:#ffd700;color:#ffd700;pointer-events:none}
#diagBtnRow button.pass{border-color:#00e676;color:#00e676}
#diagBtnRow button.fail{border-color:#ff2d55;color:#ff2d55}
#diagLog{flex:1;overflow-y:auto;padding:8px 14px;font-family:'Courier New',monospace;font-size:.68rem;line-height:1.6;max-height:420px;scrollbar-width:thin;scrollbar-color:#333 transparent}
#diagLog::-webkit-scrollbar{width:5px}
#diagLog::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
#diagLog .ts{color:#555;margin-right:6px}
#diagLog .ok{color:#00e676}
#diagLog .warn{color:#ffd700}
#diagLog .err{color:#ff2d55}
#diagLog .info{color:#4cb1ff}
#diagLog .dim{color:#666}
#diagState{padding:8px 14px;border-top:1px solid #222;font-size:.68rem;color:#888;line-height:1.5}
#diagState b{color:#bbb;font-weight:600}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>

<!-- Diagnostics -->
<button id="diagToggle" onclick="toggleDiagPanel()">DIAG</button>
<div id="diagPanel">
  <div id="diagHeader"><span>NETWORK DIAGNOSTICS</span><button onclick="toggleDiagPanel()" style="background:none;border:none;color:#666;cursor:pointer;font-size:1rem">&times;</button></div>
  <div id="diagBtnRow">
    <button id="diagBtnAll" onclick="runAllDiag()">Run All Tests</button>
    <button id="diagBtnStun" onclick="runDiagStun()">STUN</button>
    <button id="diagBtnTurn" onclick="runDiagTurn()">TURN</button>
    <button id="diagBtnSignal" onclick="runDiagSignal()">PeerJS Signal</button>
    <button id="diagBtnWebRTC" onclick="runDiagWebRTC()">WebRTC Channel</button>
    <button id="diagBtnClear" onclick="clearDiagLog()" style="margin-left:auto;border-color:#555;color:#888">Clear</button>
  </div>
  <div id="diagLog"></div>
  <div id="diagState">
    <b>Live State:</b> <span id="diagLiveState">idle</span>
  </div>
</div>

<!-- Volume -->
<div id="volumeWrap">
  <button id="muteBtn" onclick="toggleMute()">&#x1f50a;</button>
  <label>VOL</label>
  <input id="volSlider" type="range" min="0" max="100" value="50" oninput="setVolume(this.value)">
</div>

<h1>Tetris SAGA</h1>

<!-- Menu -->
<div id="menu">
  <button class="btn-solo" onclick="startGame('solo')">Solo</button>
  <button class="btn-local" onclick="showNameEntry()">Local Multiplayer</button>
  <button class="btn-online" onclick="showLobby()">Online Multiplayer</button>
  <div class="menu-sep" id="saveSep" style="display:none"></div>
  <button class="btn-continue" id="btnContSolo" style="display:none" onclick="loadGame('solo')">Continue Solo</button>
  <button class="btn-continue" id="btnContLocal" style="display:none" onclick="loadGame('local')">Continue Local</button>
  <button class="btn-delete-save" id="btnDelSaves" style="display:none" onclick="deleteAllSaves()">Clear Saved Games</button>
</div>

<!-- Name Entry (Local Multiplayer) -->
<div id="nameEntry">
  <div class="ne-title">Enter Player Names</div>
  <div class="name-row"><label>Player 1</label><input class="name-input" id="localName1" placeholder="Player 1" maxlength="16"/></div>
  <div class="name-row"><label>Player 2</label><input class="name-input" id="localName2" placeholder="Player 2" maxlength="16"/></div>
  <button class="btn-local" onclick="startLocalWithNames()">Start Game</button>
  <button class="btn-back-sm" onclick="nameEntryBack()">Back</button>
</div>

<!-- Online Lobby -->
<div id="lobby">
  <div class="lobby-title">Online Multiplayer (2–4 players)</div>
  <input id="onlineNameInput" placeholder="Enter your name" maxlength="16"/>
  <button class="btn-create" onclick="createRoom()">Create Room</button>
  <div style="display:flex;gap:8px;align-items:center">
    <input id="joinInput" placeholder="CODE" maxlength="6"/>
    <button class="btn-join" style="width:auto;padding:12px 20px" onclick="joinRoom()">Join</button>
  </div>
  <div id="lobbyStatus"></div>
  <div id="playerList"></div>
  <button class="btn-start" id="btnStartOnline" style="display:none" onclick="hostStartGame()">Start Game</button>
  <button class="btn-back-sm" onclick="leaveLobby()">Back</button>
</div>

<!-- Game -->
<div id="gameArea"></div>

<!-- Toolbar -->
<div id="toolbar">
  <button class="tb-pause" id="btnPause" onclick="uiTogglePause()">Pause</button>
  <span id="pauseInfo"></span>
  <button class="tb-save" id="btnSave" onclick="saveAndQuit()" style="display:none">Save &amp; Quit</button>
  <button class="tb-back" onclick="backToMenu()">Back to Menu</button>
</div>

<!-- Controls -->
<div id="controls"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   CONSTANTS
   ═══════════════════════════════════════════════════════════════════════ */
const COLS=10,ROWS=20,PREVIEW_CELLS=5;
const SHAPES={
  I:{blocks:[[0,0],[1,0],[2,0],[3,0]],color:'#00d4ff'},
  O:{blocks:[[0,0],[1,0],[0,1],[1,1]],color:'#ffd700'},
  T:{blocks:[[0,0],[1,0],[2,0],[1,1]],color:'#b44dff'},
  S:{blocks:[[1,0],[2,0],[0,1],[1,1]],color:'#00e676'},
  Z:{blocks:[[0,0],[1,0],[1,1],[2,1]],color:'#ff2d55'},
  J:{blocks:[[0,0],[0,1],[1,1],[2,1]],color:'#2979ff'},
  L:{blocks:[[2,0],[0,1],[1,1],[2,1]],color:'#ff9100'},
};
const SHAPE_KEYS=Object.keys(SHAPES);
const PLAYER_COLORS=['#00d4ff','#ff2d95','#ffd700','#00e676','#ff9100','#b44dff'];

/* ═══════════════════════════════════════════════════════════════════════
   AUDIO ENGINE (Web Audio API)
   ═══════════════════════════════════════════════════════════════════════ */
let audioCtx=null, masterGain=null, musicGain=null, sfxGain=null;
let musicPlaying=false, musicTimeout=null, musicNoteIdx=0, musicNextTime=0;
let muted=false, volumeVal=50;

// Korobeiniki melody (freq, beats)
const N={A3:220,B3:246.94,C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,R:0,
         A2:110,E2:164.81,E3:164.81,D3:146.83,C3:130.81};
const MELODY=[
  [N.E4,1],[N.B3,.5],[N.C4,.5],[N.D4,1],[N.C4,.5],[N.B3,.5],
  [N.A3,1],[N.A3,.5],[N.C4,.5],[N.E4,1],[N.D4,.5],[N.C4,.5],
  [N.B3,1.5],[N.C4,.5],[N.D4,1],[N.E4,1],
  [N.C4,1],[N.A3,1],[N.A3,1],[N.R,1],
  [N.D4,1],[N.R,.5],[N.F4,.5],[N.A4,1],[N.G4,.5],[N.F4,.5],
  [N.E4,1.5],[N.C4,.5],[N.E4,1],[N.D4,.5],[N.C4,.5],
  [N.B3,1.5],[N.C4,.5],[N.D4,1],[N.E4,1],
  [N.C4,1],[N.A3,1],[N.A3,1],[N.R,1],
];
const BASS=[
  [N.A2,2],[N.E3,2],[N.A2,2],[N.E3,2],
  [N.A2,2],[N.E3,2],[N.A2,2],[N.E3,2],
  [N.D3,2],[N.A2,2],[N.E3,2],[N.E2,2],
  [N.D3,2],[N.A2,2],[N.A2,2],[N.E2,2],
];
const MUSIC_BPM=140;
let bassIdx=0,bassNextTime=0;

function initAudio(){
  if(audioCtx) return;
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain();masterGain.gain.value=volumeVal/100;masterGain.connect(audioCtx.destination);
  musicGain=audioCtx.createGain();musicGain.gain.value=0.28;musicGain.connect(masterGain);
  sfxGain=audioCtx.createGain();sfxGain.gain.value=0.6;sfxGain.connect(masterGain);
}

function setVolume(v){
  volumeVal=+v;document.getElementById('volSlider').value=v;

function startMusic(){
  if(musicPlaying)return;initAudio();
  if(audioCtx.state==='suspended')audioCtx.resume();
  musicPlaying=true;
  musicNoteIdx=0;bassIdx=0;
  musicNextTime=audioCtx.currentTime+0.1;bassNextTime=musicNextTime;
  scheduleMusic();
}
function stopMusic(){musicPlaying=false;if(musicTimeout)clearTimeout(musicTimeout);}

function scheduleMusic(){
  if(!musicPlaying)return;
  const beatDur=60/MUSIC_BPM;
  while(musicNextTime<audioCtx.currentTime+0.3){
    const[freq,dur]=MELODY[musicNoteIdx%MELODY.length];
    if(freq>0){
      const o=audioCtx.createOscillator();o.type='square';o.frequency.value=freq;
      const g=audioCtx.createGain();g.gain.setValueAtTime(0.18,musicNextTime);
      g.gain.exponentialRampToValueAtTime(0.001,musicNextTime+dur*beatDur*0.92);
      o.connect(g);g.connect(musicGain);o.start(musicNextTime);o.stop(musicNextTime+dur*beatDur);
    }
    musicNextTime+=dur*beatDur;musicNoteIdx++;
  }
  while(bassNextTime<audioCtx.currentTime+0.3){
    const[freq,dur]=BASS[bassIdx%BASS.length];
    if(freq>0){
      const o=audioCtx.createOscillator();o.type='triangle';o.frequency.value=freq;
      const g=audioCtx.createGain();g.gain.setValueAtTime(0.22,bassNextTime);
      g.gain.exponentialRampToValueAtTime(0.001,bassNextTime+dur*beatDur*0.9);
      o.connect(g);g.connect(musicGain);o.start(bassNextTime);o.stop(bassNextTime+dur*beatDur);
    }
    bassNextTime+=dur*beatDur;bassIdx++;
  }
  musicTimeout=setTimeout(scheduleMusic,80);
}

/* SFX */
function sfx(name){
  initAudio();
  if(audioCtx.state==='suspended')audioCtx.resume();
  const t=audioCtx.currentTime;
  if(name==='move'){
    const o=audioCtx.createOscillator();o.type='sine';o.frequency.value=400;
    const g=audioCtx.createGain();g.gain.setValueAtTime(0.18,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.06);
    o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+0.06);
  }else if(name==='rotate'){
    const o=audioCtx.createOscillator();o.type='square';o.frequency.setValueAtTime(500,t);o.frequency.exponentialRampToValueAtTime(700,t+0.06);
    const g=audioCtx.createGain();g.gain.setValueAtTime(0.13,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.07);
    o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+0.07);
  }else if(name==='lock'){
    const o=audioCtx.createOscillator();o.type='triangle';o.frequency.value=180;
    const g=audioCtx.createGain();g.gain.setValueAtTime(0.25,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
    o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+0.1);
  }else if(name==='hardDrop'){
    const o=audioCtx.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(40,t+0.12);
    const g=audioCtx.createGain();g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.13);
    o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+0.13);
  }else if(name==='lineClear'){
    const o=audioCtx.createOscillator();o.type='square';o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(1200,t+0.28);
    const g=audioCtx.createGain();g.gain.setValueAtTime(0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
    o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+0.3);
  }else if(name==='gameOver'){
    const o=audioCtx.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(500,t);o.frequency.exponentialRampToValueAtTime(80,t+0.6);
    const g=audioCtx.createGain();g.gain.setValueAtTime(0.25,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.65);
    o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+0.65);
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   PARTICLE SYSTEM
   ═══════════════════════════════════════════════════════════════════════ */
class Particle{
  constructor(x,y,color){
    this.x=x;this.y=y;this.color=color;
    this.vx=(Math.random()-0.5)*10;this.vy=(Math.random()-1)*7;
    this.size=Math.random()*5+2;this.life=1;this.decay=Math.random()*0.025+0.018;this.gravity=0.18;
  }
  update(){this.x+=this.vx;this.y+=this.vy;this.vy+=this.gravity;this.vx*=0.98;this.life-=this.decay;}
  draw(ctx){
    if(this.life<=0)return;ctx.globalAlpha=Math.max(0,this.life);ctx.fillStyle=this.color;
    ctx.shadowColor=this.color;ctx.shadowBlur=6;
    ctx.fillRect(this.x-this.size/2,this.y-this.size/2,this.size,this.size);
    ctx.shadowBlur=0;ctx.globalAlpha=1;
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════════════════ */
function randomPiece(){
  const k=SHAPE_KEYS[Math.floor(Math.random()*SHAPE_KEYS.length)];
  return{key:k,blocks:SHAPES[k].blocks.map(b=>[...b]),color:SHAPES[k].color};
}
function rotate(blocks,dir){
  const cx=blocks.reduce((s,b)=>s+b[0],0)/blocks.length;
  const cy=blocks.reduce((s,b)=>s+b[1],0)/blocks.length;
  return blocks.map(([x,y])=>{const dx=x-cx,dy=y-cy;const nx=dir===1?-dy:dy,ny=dir===1?dx:-dx;return[Math.round(cx+nx),Math.round(cy+ny)];});
}

/* ═══════════════════════════════════════════════════════════════════════
   BOARD CLASS
   ═══════════════════════════════════════════════════════════════════════ */
class Board{
  constructor(canvas,previewCanvas,elScore,elLevel,elLines,overlay,pauseBanner,cellSize,opts={}){
    this.cell=cellSize;
    this.canvas=canvas;this.ctx=canvas.getContext('2d');
    this.previewCanvas=previewCanvas;this.pctx=previewCanvas.getContext('2d');
    this.elScore=elScore;this.elLevel=elLevel;this.elLines=elLines;
    this.overlay=overlay;this.pauseBanner=pauseBanner;
    this.interactive=opts.interactive!==false;
    this.grid=this.emptyGrid();this.score=0;this.lines=0;this.level=1;
    this.gameOver=false;this.paused=false;this._won=false;
    this.current=null;this.currentPos={x:0,y:0};
    this.nextPiece=randomPiece();
    this.particles=[];
    this.dropCounter=0;
    if(this.interactive)this.spawnPiece();
  }
  emptyGrid(){return Array.from({length:ROWS},()=>Array(COLS).fill(null))}
  get dropInterval(){return Math.max(50,800-(this.level-1)*80)}

  spawnPiece(){
    this.current=this.nextPiece;this.nextPiece=randomPiece();
    const minX=Math.min(...this.current.blocks.map(b=>b[0]));
    const maxX=Math.max(...this.current.blocks.map(b=>b[0]));
    this.currentPos={x:Math.floor((COLS-(maxX-minX+1))/2)-minX,y:0};
    if(!this.valid(this.current.blocks,this.currentPos)){this.gameOver=true;this.showOverlay(this._won?'YOU WIN!':'GAME OVER',this._won?'win':'game-over');sfx('gameOver');}
    this.drawPreview();
  }

  valid(blocks,pos){return blocks.every(([bx,by])=>{const x=bx+pos.x,y=by+pos.y;return x>=0&&x<COLS&&y<ROWS&&(y<0||!this.grid[y][x]);});}

  lock(){
    this.current.blocks.forEach(([bx,by])=>{const x=bx+this.currentPos.x,y=by+this.currentPos.y;if(y>=0)this.grid[y][x]=this.current.color;});
    sfx('lock');this.clearLines();this.spawnPiece();
  }

  clearLines(){
    let cleared=[];
    for(let r=ROWS-1;r>=0;r--){if(this.grid[r].every(c=>c))cleared.push(r);}
    if(cleared.length){
      sfx('lineClear');
      // Spawn particles for each cell in the cleared rows
      for(const r of cleared){
        for(let c=0;c<COLS;c++){
          const color=this.grid[r][c]||'#fff';
          const cx=c*this.cell+this.cell/2,cy=r*this.cell+this.cell/2;
          for(let i=0;i<8;i++)this.particles.push(new Particle(cx,cy,color));
        }
      }
      // Remove cleared rows: filter out full rows and prepend empty ones
      this.grid=this.grid.filter((_,i)=>!cleared.includes(i));
      while(this.grid.length<ROWS)this.grid.unshift(Array(COLS).fill(null));
      const pts=[0,100,300,500,800];this.score+=(pts[cleared.length]||0)*this.level;
      this.lines+=cleared.length;this.level=Math.floor(this.lines/10)+1;
    }
  }

  move(dx,dy){
    if(this.gameOver||this.paused)return false;
    const np={x:this.currentPos.x+dx,y:this.currentPos.y+dy};
    if(this.valid(this.current.blocks,np)){this.currentPos=np;if(dx!==0)sfx('move');return true;}return false;
  }

  rotatePiece(dir){
    if(this.gameOver||this.paused||!this.current)return;
    const nb=rotate(this.current.blocks,dir);
    for(const[ox,oy] of [[0,0],[-1,0],[1,0],[-2,0],[2,0],[0,-1],[0,-2]]){
      const tp={x:this.currentPos.x+ox,y:this.currentPos.y+oy};
      if(this.valid(nb,tp)){this.current.blocks=nb;this.currentPos=tp;sfx('rotate');return;}
    }
  }

  hardDrop(){
    if(this.gameOver||this.paused)return;
    while(this.move(0,1)){}
    sfx('hardDrop');this.lock();
  }

  update(dt){
    if(this.gameOver||this.paused||!this.interactive)return;
    this.dropCounter+=dt;
    if(this.dropCounter>=this.dropInterval){this.dropCounter=0;if(!this.move(0,1))this.lock();}
  }

  ghostY(){
    if(!this.current)return this.currentPos.y;
    let gy=this.currentPos.y;
    while(this.valid(this.current.blocks,{x:this.currentPos.x,y:gy+1}))gy++;
    return gy;
  }

  draw(){
    const c=this.cell,ctx=this.ctx;
    ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
    // Grid bg
    ctx.fillStyle='#0d0d1a';ctx.fillRect(0,0,COLS*c,ROWS*c);
    for(let r=0;r<ROWS;r++)for(let cl=0;cl<COLS;cl++){ctx.strokeStyle='#1a1a2e';ctx.strokeRect(cl*c,r*c,c,c);}
    // Locked cells
    for(let r=0;r<ROWS;r++)for(let cl=0;cl<COLS;cl++){
      if(this.grid[r][cl]){ctx.fillStyle=this.grid[r][cl];ctx.fillRect(cl*c+1,r*c+1,c-2,c-2);
        ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(cl*c+1,r*c+1,c-2,4);}
    }
    if(this.current){
      // Ghost
      const gy=this.ghostY();
      ctx.globalAlpha=0.18;ctx.fillStyle=this.current.color;
      this.current.blocks.forEach(([bx,by])=>{ctx.fillRect((bx+this.currentPos.x)*c+1,(by+gy)*c+1,c-2,c-2);});
      ctx.globalAlpha=1;
      // Current
      ctx.fillStyle=this.current.color;
      this.current.blocks.forEach(([bx,by])=>{const x=(bx+this.currentPos.x)*c,y=(by+this.currentPos.y)*c;
        ctx.fillRect(x+1,y+1,c-2,c-2);ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(x+1,y+1,c-2,4);ctx.fillStyle=this.current.color;});
    }
    // Particles
    for(let i=this.particles.length-1;i>=0;i--){this.particles[i].update();this.particles[i].draw(ctx);if(this.particles[i].life<=0)this.particles.splice(i,1);}
    // Stats
    this.elScore.textContent=this.score;this.elLevel.textContent=this.level;this.elLines.textContent=this.lines;
  }

  drawPreview(){
    if(!this.nextPiece)return;
    const c=this.cell,ctx=this.pctx;
    ctx.clearRect(0,0,this.previewCanvas.width,this.previewCanvas.height);
    ctx.fillStyle='#0d0d1a';ctx.fillRect(0,0,this.previewCanvas.width,this.previewCanvas.height);
    const nb=this.nextPiece.blocks;
    const minX=Math.min(...nb.map(b=>b[0])),maxX=Math.max(...nb.map(b=>b[0]));
    const minY=Math.min(...nb.map(b=>b[1])),maxY=Math.max(...nb.map(b=>b[1]));
    const ox=(PREVIEW_CELLS-(maxX-minX+1))/2-minX,oy=(PREVIEW_CELLS-(maxY-minY+1))/2-minY;
    ctx.fillStyle=this.nextPiece.color;
    nb.forEach(([bx,by])=>{ctx.fillRect((bx+ox)*c+1,(by+oy)*c+1,c-2,c-2);});
  }

  showOverlay(text,cls){
    this.overlay.innerHTML='';
    const s=document.createElement('span');s.textContent=text;if(cls==='win')s.className='win';
    this.overlay.appendChild(s);this.overlay.classList.add('active');
  }

  togglePause(){
    if(this.gameOver)return;
    this.paused=!this.paused;this.pauseBanner.classList.toggle('active',this.paused);
  }
  setPause(v){if(this.gameOver)return;this.paused=v;this.pauseBanner.classList.toggle('active',v);}

  serialize(){
    return{grid:this.grid,score:this.score,lines:this.lines,level:this.level,gameOver:this.gameOver,
      current:this.current?{key:this.current.key,blocks:this.current.blocks,color:this.current.color}:null,
      currentPos:this.currentPos,
      nextPiece:this.nextPiece?{key:this.nextPiece.key,blocks:this.nextPiece.blocks,color:this.nextPiece.color}:null};
  }

  applyState(s){
    const wasAlive=!this.gameOver;
    this.grid=s.grid;this.score=s.score;this.lines=s.lines;this.level=s.level;this.gameOver=s.gameOver;
    this.current=s.current;this.currentPos=s.currentPos||{x:0,y:0};this.nextPiece=s.nextPiece;
    this.drawPreview();
    if(wasAlive&&this.gameOver){this.showOverlay('GAME OVER','game-over');}
  }

  toSave(){
    return{grid:this.grid,score:this.score,lines:this.lines,level:this.level,
      current:this.current?{key:this.current.key,blocks:this.current.blocks,color:this.current.color}:null,
      currentPos:this.currentPos,
      nextPiece:this.nextPiece?{key:this.nextPiece.key,blocks:this.nextPiece.blocks,color:this.nextPiece.color}:null};
  }

  loadSave(s){
    this.grid=s.grid;this.score=s.score;this.lines=s.lines;this.level=s.level;
    this.current=s.current;this.currentPos=s.currentPos;this.nextPiece=s.nextPiece;
    this.drawPreview();
  }
}

function buildSection(label,labelClass,cellSize){
  const section=document.createElement('div');section.className='player-section';
  if(label){const lbl=document.createElement('div');lbl.className='player-label'+(labelClass?' '+labelClass:'');lbl.textContent=label;section.appendChild(lbl);}
  const wrap=document.createElement('div');wrap.className='board-wrap';
  const cv=document.createElement('canvas');cv.width=COLS*cellSize;cv.height=ROWS*cellSize;wrap.appendChild(cv);
  const ov=document.createElement('div');ov.className='overlay';wrap.appendChild(ov);
  const pb=document.createElement('div');pb.className='pause-banner';const ps=document.createElement('span');ps.textContent='PAUSED';pb.appendChild(ps);wrap.appendChild(pb);
  section.appendChild(wrap);
  const sidePanel=document.createElement('div');sidePanel.className='side-panel';
  const infoCol=document.createElement('div');infoCol.className='info-col';
  function mkInfo(t){const l=document.createElement('div');l.className='label';l.textContent=t;const v=document.createElement('div');v.className='value';v.textContent='0';infoCol.appendChild(l);infoCol.appendChild(v);return v;}
  const elScore=mkInfo('Score'),elLevel=mkInfo('Level'),elLines=mkInfo('Lines');
  sidePanel.appendChild(infoCol);
  const nextBox=document.createElement('div');nextBox.className='next-box';
  const nl=document.createElement('div');nl.className='label';nl.textContent='Next';nextBox.appendChild(nl);
  const pcv=document.createElement('canvas');pcv.width=PREVIEW_CELLS*cellSize;pcv.height=PREVIEW_CELLS*cellSize;nextBox.appendChild(pcv);
  sidePanel.appendChild(nextBox);section.appendChild(sidePanel);
  return{section,cv,pcv,elScore,elLevel,elLines,ov,pb};
}

/* ═══════════════════════════════════════════════════════════════════════
   SOLO & LOCAL
   ═══════════════════════════════════════════════════════════════════════ */
function startGame(m,loadData=null){
  initAudio();startMusic();if(typeof bgFade==='function')bgFade();
  mode=m;$menu.style.display='none';$lobby.style.display='none';$nameEntry.style.display='none';
  $gameArea.innerHTML='';$gameArea.style.display='flex';
  $toolbar.style.display='flex';$controls.style.display='flex';$controls.innerHTML='';
  $btnSave.style.display='inline-block';$pauseInfo.textContent='';
  boards=[];

  const cell=28;
  if(m==='solo'){
    const s=buildSection('','',cell);$gameArea.appendChild(s.section);
    const b=new Board(s.cv,s.pcv,s.elScore,s.elLevel,s.elLines,s.ov,s.pb,cell);
    if(loadData)b.loadSave(loadData[0]);
    boards.push(b);$controls.innerHTML=soloControls();
  }else if(m==='local'){
    for(let i=0;i<2;i++){
      const s=buildSection(localPlayerNames[i],'',cell);$gameArea.appendChild(s.section);
      const b=new Board(s.cv,s.pcv,s.elScore,s.elLevel,s.elLines,s.ov,s.pb,cell);
      if(loadData&&loadData[i])b.loadSave(loadData[i]);
      boards.push(b);
    }
    $controls.innerHTML=localControls();
  }
  let last=performance.now();
  function loop(now){
    const dt=now-last;last=now;
    boards.forEach(b=>{b.update(dt);b.draw();});
    // Local mode: mark last surviving player as winner
    if(m==='local'){
      const alive=boards.filter(b=>!b.gameOver);
      if(alive.length===1&&!alive[0]._won){
        alive[0]._won=true;
        alive[0].showOverlay('LAST STANDING!','win');
        setTimeout(()=>{if(!alive[0].gameOver)alive[0].overlay.classList.remove('active');},2000);
      }
    }
    rafId=requestAnimationFrame(loop);
  }
  rafId=requestAnimationFrame(loop);
}

/*
  Multi-endpoint host: the host registers HOST_PEER_COUNT PeerJS peers
  (e.g. ts-CODE-0, ts-CODE-1, ts-CODE-2). Each accepts connections independently.
  Joiners try ALL endpoints in parallel and use whichever opens first.
  This avoids the PeerJS free server per-peer connection cap (~2-3).
*/
const HOST_PEER_COUNT=3;
let createRoomCode='';
let joinRetries=0;
const MAX_JOIN_RETRIES=4;
const JOIN_TIMEOUT_MS=10000;
let joinTimeoutId=null;
let isJoining=false;
let _retryScheduled=false;  // guard: prevents multiple error paths from cascading retries
let pendingJoinConns=[];  // parallel join attempts
let joinerPeerId=null;  // stable ID across retries

/* ── Host: Create Room ── */
function createRoom(){
  cleanupPeer();isHost=true;myIndex=0;
  myOnlineName=$onlineNameInput.value.trim()||'Host';
  createRoomCode=generateCode();
  $lobbyStatus.innerHTML='<div class="hint">Creating room...</div>';
  _initHostPeers(createRoomCode);
}

function _initHostPeers(code){
  const knownPeerIds=new Set();
  let peersReady=0;

  for(let i=0;i<HOST_PEER_COUNT;i++){
    const p=new Peer('ts-'+code+'-'+i,{config:ICE_CONFIG});
    hostPeers.push(p);

    p.on('open',()=>{
      peersReady++;
      if(peersReady===1){
        // Show lobby as soon as first endpoint is ready
        lobbyPlayers=[{name:myOnlineName}];
        totalPlayers=1;
        updateLobbyUI(code);
        $btnStartOnline.style.display='inline-block';
        $btnStartOnline.disabled=true;$btnStartOnline.style.opacity='0.4';
      }
    });

    p.on('connection',(c)=>{
      if(totalPlayers>=4){c.close();return;}
      const peerId=c.peer;
      // Deduplicate: if this peer reconnected via another endpoint, reuse their slot
      if(knownPeerIds.has(peerId)){
        const oldIdx=conns.findIndex(oc=>oc.peer===peerId);
        if(oldIdx!==-1){
          const oldConn=conns[oldIdx];
          const oldPlayerIdx=oldConn._playerIndex;
          // Remove from conns BEFORE closing to prevent stale close handler
          conns.splice(oldIdx,1);
          try{oldConn.close();}catch(e){}
          c._playerIndex=oldPlayerIdx;
          conns.push(c);
          const jn=(c.metadata&&c.metadata.name)?c.metadata.name:('Player '+(oldPlayerIdx+1));
          lobbyPlayers[oldPlayerIdx]={name:jn};
          function onReconn(){
            c.send(JSON.stringify({type:'welcome',playerIndex:oldPlayerIdx,totalPlayers:totalPlayers}));
            broadcastLobby();updateLobbyUI(code);
            if(totalPlayers>=2){$btnStartOnline.disabled=false;$btnStartOnline.style.opacity='1';}
          }
          if(c.open){onReconn();}else{c.on('open',onReconn);}
          c.on('data',(raw)=>handleHostData(raw,c));
          c.on('close',()=>{if(conns.includes(c))handlePlayerDisconnect(oldPlayerIdx);});
          return;
        }
      }
      knownPeerIds.add(peerId);
      const idx=totalPlayers;totalPlayers++;
      c._playerIndex=idx;
      conns.push(c);
      const jn=(c.metadata&&c.metadata.name)?c.metadata.name:('Player '+(idx+1));
      lobbyPlayers.push({name:jn});

      function onReady(){
        c.send(JSON.stringify({type:'welcome',playerIndex:idx,totalPlayers:totalPlayers}));
        broadcastLobby();updateLobbyUI(code);
        if(totalPlayers>=2){$btnStartOnline.disabled=false;$btnStartOnline.style.opacity='1';}
      }
      if(c.open){onReady();}else{c.on('open',onReady);}
      c.on('data',(raw)=>handleHostData(raw,c));
      c.on('close',()=>{if(conns.includes(c))handlePlayerDisconnect(idx);});
    });

    p.on('error',(err)=>{
      if(err.type==='unavailable-id'&&peersReady===0&&i===0){
        const nc=generateCode();createRoomCode=nc;
        $lobbyStatus.innerHTML='<div class="hint">Room code conflict, retrying...</div>';
        hostPeers.forEach(hp=>{try{hp.destroy();}catch(e){}});hostPeers=[];
        setTimeout(()=>_initHostPeers(nc),500);
      }
    });
  }
}

/* ── Joiner: Join Room ── */
function joinRoom(){
  if(isJoining)return;
  isJoining=true;
  cleanupPeer();isHost=false;joinRetries=0;
  myOnlineName=$onlineNameInput.value.trim()||'Player';
  const code=$joinInput.value.trim().toUpperCase();
  if(!code||code.length<3){isJoining=false;$lobbyStatus.innerHTML='<div class="hint" style="color:#ffd700">Enter a valid room code.</div>';return;}
  // Generate a stable peer ID for this join session (survives retries)
  joinerPeerId='ts-'+code+'-j-'+Math.random().toString(36).substr(2,8);
  const joinBtn=document.querySelector('.btn-join');
  if(joinBtn){joinBtn.disabled=true;joinBtn.style.opacity='0.5';}
  _attemptJoin(code);
}

function _resetJoinBtn(){
  isJoining=false;
  const joinBtn=document.querySelector('.btn-join');
  if(joinBtn){joinBtn.disabled=false;joinBtn.style.opacity='1';}
}

function _attemptJoin(code){
  _retryScheduled=false;  // we are now executing, clear the guard
  joinRetries++;
  const attempt=joinRetries;
  $lobbyStatus.innerHTML='<div class="hint">Connecting... (attempt '+attempt+'/'+MAX_JOIN_RETRIES+')</div>';

  // Helper: schedule ONE retry, guarded against cascading calls
  function _scheduleRetry(reason,delayMs){
    if(_retryScheduled)return;  // another error path already scheduled a retry
    _retryScheduled=true;
    if(joinTimeoutId){clearTimeout(joinTimeoutId);joinTimeoutId=null;}
    if(attempt<MAX_JOIN_RETRIES){
      $lobbyStatus.innerHTML='<div class="hint" style="color:#ffd700">'+reason+', retrying ('+attempt+'/'+MAX_JOIN_RETRIES+')...</div>';
      setTimeout(()=>_attemptJoin(code),delayMs);
    }else{
      _resetJoinBtn();
      $lobbyStatus.innerHTML='<div class="hint" style="color:#ff2d55">Could not connect after '+MAX_JOIN_RETRIES+' attempts. Check the code and your network. <button onclick=\"_resetJoinBtn();joinRetries=0;_retryScheduled=false;_attemptJoin(\''+code+'\')\" style=\"color:#00d4ff;background:none;border:1px solid #00d4ff;border-radius:4px;padding:4px 12px;cursor:pointer;margin-left:8px\">Retry</button></div>';
    }
  }

  // Destroy previous peer (detach events first to prevent stale callbacks)
  if(peer){try{peer.removeAllListeners();peer.destroy();}catch(e){}}
  // Close any pending parallel conns from previous attempt
  pendingJoinConns.forEach(c=>{try{c.removeAllListeners();c.close();}catch(e){}});
  pendingJoinConns=[];

  // Use stable peer ID so host can deduplicate retries
  peer=new Peer(joinerPeerId,{config:ICE_CONFIG});

  // Timeout (per-attempt)
  if(joinTimeoutId)clearTimeout(joinTimeoutId);
  joinTimeoutId=setTimeout(()=>{
    if(mode==='online')return;  // already in-game, ignore stale timer
    pendingJoinConns.forEach(c=>{try{c.close();}catch(e){}});pendingJoinConns=[];
    _scheduleRetry('Attempt '+attempt+' timed out',2000);
  },JOIN_TIMEOUT_MS);

  peer.on('open',()=>{
    let connected=false;
    // Try ALL host endpoints in parallel
    for(let i=0;i<HOST_PEER_COUNT;i++){
      const c=peer.connect('ts-'+code+'-'+i,{reliable:true,metadata:{name:myOnlineName}});
      pendingJoinConns.push(c);

      c.on('open',()=>{
        if(connected){try{c.close();}catch(e){}return;}  // another endpoint won
        connected=true;_retryScheduled=true;  // lock out any stale error handlers
        conn=c;
        // Close other pending connections
        pendingJoinConns.forEach(pc=>{if(pc!==c){try{pc.close();}catch(e){}}});
        pendingJoinConns=[];
        if(joinTimeoutId){clearTimeout(joinTimeoutId);joinTimeoutId=null;}
        isJoining=false;
        $lobbyStatus.innerHTML='<div class="hint" style="color:#00e676">Connected! Waiting for host to start...</div>';
      });

      c.on('data',(raw)=>{
        if(c===conn)handleJoinerData(raw);
      });

      c.on('close',()=>{
        if(c===conn){
          if(mode==='online'){handleOpponentDisconnect();}
          else{_resetJoinBtn();$lobbyStatus.innerHTML='<div class="hint" style="color:#ff2d55">Disconnected from host.</div>';}
        }
      });

      c.on('error',()=>{
        // Individual endpoint failed — only act if ALL have failed
        pendingJoinConns=pendingJoinConns.filter(pc=>pc!==c);
        if(!connected&&pendingJoinConns.length===0){
          _scheduleRetry('All endpoints failed',2000);
        }
      });
    }
  });

  peer.on('error',(err)=>{
    _scheduleRetry('Network error ('+err.type+')',2000);
  });
}


function updateLobbyUI(code){
  $lobbyStatus.innerHTML='<div class="hint">Share this code:</div><div class="code-display">'+code+'</div><div class="hint">'+totalPlayers+' player'+(totalPlayers!==1?'s':'')+' in room'+(totalPlayers>=2?' &mdash; ready to start':'')+'</div>';
  let html='';
  lobbyPlayers.forEach((p,i)=>{
    if(i===0){
      html+='<div>&#9733; '+p.name+' <span class="host-tag">HOST</span></div>';
    }else{
      html+='<div style="display:flex;align-items:center;justify-content:center;gap:8px"> '+p.name;
      if(isHost){
        html+=' <button onclick="kickPlayer('+i+')" style="background:none;border:1px solid #ff2d55;color:#ff2d55;border-radius:3px;padding:0 4px;font-size:.7rem;cursor:pointer;font-weight:700;line-height:1.4;opacity:.7;width:auto;flex:none" title="Kick player">&times;</button>';
      }
      html+='</div>';
    }
  });
  $playerList.innerHTML=html;
}

function broadcastLobby(){
  const msg=JSON.stringify({type:'lobbyUpdate',players:lobbyPlayers,totalPlayers:totalPlayers});
  conns.forEach(c=>{if(c.open)c.send(msg);});
}

function hostStartGame(){
  if(totalPlayers<2)return;
  conns.forEach(c=>{if(c.open)c.send(JSON.stringify({type:'start',totalPlayers:totalPlayers,players:lobbyPlayers,yourIndex:c._playerIndex}));});
  startOnlineGame(totalPlayers,0,lobbyPlayers);
}

function handleHostData(raw,fromConn){
  try{
    const msg=JSON.parse(raw);
    if(msg.type==='state'){
      // Relay to all OTHER connections and apply locally
      const idx=fromConn._playerIndex;
      const relay=JSON.stringify({type:'peerState',index:idx,data:msg.data});
      conns.forEach(c=>{if(c!==fromConn&&c.open)c.send(relay);});
      // Apply to local opponent board
      if(opBoards[idx])opBoards[idx].applyState(msg.data);
      checkWinCondition();
    }else if(msg.type==='pauseReq'){
      const idx=fromConn._playerIndex;
      if(onlinePauseCounts[idx]>0&&!globalPaused){
        onlinePauseCounts[idx]--;
        globalPaused=true;
        const pmsg=JSON.stringify({type:'paused',byPlayer:idx,pauseCounts:onlinePauseCounts});
        conns.forEach(c=>{if(c.open)c.send(pmsg);});
        applyGlobalPause(true,idx);
      }
    }else if(msg.type==='unpauseReq'){
      if(globalPaused){
        globalPaused=false;
        const umsg=JSON.stringify({type:'unpaused'});
        conns.forEach(c=>{if(c.open)c.send(umsg);});
        applyGlobalPause(false);
      }
    }
  }catch(e){}
}

function handleJoinerData(raw){
  try{
    const msg=JSON.parse(raw);
    if(msg.type==='welcome'){myIndex=msg.playerIndex;totalPlayers=msg.totalPlayers;}
    else if(msg.type==='lobbyUpdate'){
      lobbyPlayers=msg.players;totalPlayers=msg.totalPlayers;
      $playerList.innerHTML='';lobbyPlayers.forEach((p,i)=>{
        const d=document.createElement('div');d.textContent=(i===0?'* ':' ')+p.name+(i===0?' (HOST)':'')+(i===myIndex?' (You)':'');$playerList.appendChild(d);
      });
      $lobbyStatus.innerHTML='<div class="hint">'+totalPlayers+' player'+(totalPlayers!==1?'s':'')+' in room. Waiting for host...</div>';
    }
    else if(msg.type==='start'){totalPlayers=msg.totalPlayers;lobbyPlayers=msg.players||[];const idx=(msg.yourIndex!==undefined)?msg.yourIndex:myIndex;myIndex=idx;startOnlineGame(totalPlayers,idx,lobbyPlayers);}
    else if(msg.type==='peerState'){
      const idx=msg.index;
      if(opBoards[idx])opBoards[idx].applyState(msg.data);
      checkWinCondition();
    }
    else if(msg.type==='hostState'){
      if(opBoards[0])opBoards[0].applyState(msg.data);
      checkWinCondition();
    }
    else if(msg.type==='paused'){
      onlinePauseCounts=msg.pauseCounts;globalPaused=true;applyGlobalPause(true,msg.byPlayer);
    }
    else if(msg.type==='unpaused'){globalPaused=false;applyGlobalPause(false);}
    else if(msg.type==='playerLeft'){
      const idx=msg.index;
      if(opBoards[idx]&&!opBoards[idx].gameOver){opBoards[idx].showOverlay('DISCONNECTED','game-over');opBoards[idx].gameOver=true;}
      checkWinCondition();
    }
    else if(msg.type==='gameEnded'){
      // Host ended the game — show brief notification, then return to menu
      if(myBoard&&!myBoard.gameOver){myBoard.showOverlay('HOST ENDED GAME','game-over');myBoard.gameOver=true;}
      boards.forEach(b=>{if(!b.gameOver){b.showOverlay('GAME ENDED','game-over');b.gameOver=true;}});
      if(syncInterval){clearInterval(syncInterval);syncInterval=null;}
      stopMusic();
      // Auto-return to main menu after 2 seconds
      setTimeout(()=>{backToMenu();},2000);
    }
    else if(msg.type==='kicked'){
      // Host kicked this player — return to menu with message
      cleanupPeer();
      if(rafId)cancelAnimationFrame(rafId);
      stopMusic();
      boards=[];myBoard=null;opBoards=[];
      $gameArea.style.display='none';$gameArea.innerHTML='';
      $toolbar.style.display='none';$controls.style.display='none';
      $lobby.style.display='none';$nameEntry.style.display='none';
      $menu.style.display='flex';
      if(typeof bgStart==='function')bgStart();
      setTimeout(()=>{alert('You have been removed from the room by the host.');},100);
    }
  }catch(e){}
}

function handlePlayerDisconnect(idx){
  if(mode==='online'){
    // During game
    if(opBoards[idx]&&!opBoards[idx].gameOver){opBoards[idx].showOverlay('DISCONNECTED','game-over');opBoards[idx].gameOver=true;}
    const msg=JSON.stringify({type:'playerLeft',index:idx});
    conns.forEach(c=>{if(c.open)c.send(msg);});
    checkWinCondition();
  }else if(isHost){
    // During lobby — remove player from list and adjust
    _removePlayerFromLobby(idx);
  }
}

function _removePlayerFromLobby(idx){
  // Remove connection
  conns=conns.filter(c=>c._playerIndex!==idx);
  // Remove from lobby list (shift higher indices down)
  if(idx>0&&idx<lobbyPlayers.length){
    lobbyPlayers.splice(idx,1);
    totalPlayers=lobbyPlayers.length;
    // Re-index remaining connections
    conns.forEach(c=>{if(c._playerIndex>idx)c._playerIndex--;});
    broadcastLobby();
    updateLobbyUI(createRoomCode);
    if(totalPlayers<2){$btnStartOnline.disabled=true;$btnStartOnline.style.opacity='0.4';}
  }
}

function kickPlayer(idx){
  if(!isHost||idx===0)return;  // can't kick yourself
  // Send kicked message to that player
  const target=conns.find(c=>c._playerIndex===idx);
  if(target&&target.open){try{target.send(JSON.stringify({type:'kicked'}));}catch(e){}}
  // Close the connection
  if(target){try{target.close();}catch(e){}}
  _removePlayerFromLobby(idx);
}
function handleOpponentDisconnect(){
  // Joiner lost connection to host
  if(myBoard&&!myBoard.gameOver){myBoard.showOverlay('HOST DISCONNECTED','game-over');myBoard.gameOver=true;}
}

function startOnlineGame(numPlayers,myIdx,players){
  initAudio();startMusic();if(typeof bgFade==='function')bgFade();
  mode='online';myIndex=myIdx;totalPlayers=numPlayers;
  $lobby.style.display='none';$menu.style.display='none';$nameEntry.style.display='none';
  $gameArea.innerHTML='';$gameArea.style.display='flex';
  $toolbar.style.display='flex';$controls.style.display='flex';
  $btnSave.style.display='none';
  boards=[];opBoards=new Array(numPlayers).fill(null);
  onlinePauseCounts=Array(numPlayers).fill(2);
  globalPaused=false;
  onlinePlayers=players||[];
  updatePauseInfo();

  const cell=numPlayers<=2?28:numPlayers<=4?22:18;
  // Build my board
  const myName=(players&&players[myIdx])?players[myIdx].name:'You';
  const sMe=buildSection(myName+' (You)','you',cell);
  $gameArea.appendChild(sMe.section);
  myBoard=new Board(sMe.cv,sMe.pcv,sMe.elScore,sMe.elLevel,sMe.elLines,sMe.ov,sMe.pb,cell,{interactive:true});
  boards.push(myBoard);

  // Build opponent boards
  for(let i=0;i<numPlayers;i++){
    if(i===myIdx)continue;
    const opName=(players&&players[i])?players[i].name:('Player '+(i+1));
    const sOp=buildSection(opName,'opponent',cell);
    $gameArea.appendChild(sOp.section);
    const ob=new Board(sOp.cv,sOp.pcv,sOp.elScore,sOp.elLevel,sOp.elLines,sOp.ov,sOp.pb,cell,{interactive:false});
    opBoards[i]=ob;boards.push(ob);
  }

  $controls.innerHTML=onlineControls();

  // Sync
  syncInterval=setInterval(()=>{
    if(!myBoard)return;
    const stateMsg=JSON.stringify({type:'state',data:myBoard.serialize()});
    if(isHost){
      // Host sends its state to all joiners
      const hostMsg=JSON.stringify({type:'hostState',data:myBoard.serialize()});
      conns.forEach(c=>{if(c.open)c.send(hostMsg);});
    }else{
      if(conn&&conn.open)conn.send(stateMsg);
    }
  },66);

  let last=performance.now();
  let _allDoneTimer=null;
  function loop(now){
    const dt=now-last;last=now;
    boards.forEach(b=>{b.update(dt);b.draw();});
    // Detect when ALL boards (mine + opponents) are game over
    if(!_allDoneTimer&&boards.length>1&&boards.every(b=>b.gameOver)){
      _allDoneTimer=setTimeout(()=>{
        if(syncInterval){clearInterval(syncInterval);syncInterval=null;}
        stopMusic();
        backToMenu();
      },5000);
    }
    rafId=requestAnimationFrame(loop);
  }
  rafId=requestAnimationFrame(loop);
}

function checkWinCondition(){
  if(!myBoard||myBoard.gameOver||myBoard._won)return;
  const allOpDead=Object.values(opBoards).filter(b=>b).every(b=>b.gameOver);
  if(allOpDead&&totalPlayers>1){
    myBoard._won=true;
    // Show brief "LAST STANDING" notification without ending the game
    myBoard.showOverlay('LAST STANDING!','win');
    // Auto-hide after 2 seconds so the player can keep playing
    setTimeout(()=>{
      if(myBoard&&!myBoard.gameOver){myBoard.overlay.classList.remove('active');}
    },2000);
  }
}

function applyGlobalPause(paused,byPlayer){
  boards.forEach(b=>{if(!b.gameOver)b.setPause(paused);});
  updatePauseInfo();
  if(paused){
    const pauserName=(onlinePlayers[byPlayer]&&onlinePlayers[byPlayer].name)?onlinePlayers[byPlayer].name:('P'+(byPlayer+1));
    boards.forEach(b=>{
      if(!b.gameOver){
        b.pauseBanner.querySelector('span').textContent='PAUSED by '+pauserName;
      }
    });
  }
}

function updatePauseInfo(){
  if(mode!=='online'){$pauseInfo.textContent='';return;}
  $pauseInfo.textContent='Your pauses: '+onlinePauseCounts[myIndex]+'/2';
}

/* ═══════════════════════════════════════════════════════════════════════
   PAUSE (UI button)
   ═══════════════════════════════════════════════════════════════════════ */
function uiTogglePause(){
  if(!boards.length)return;
  if(mode==='online'){
    if(globalPaused){
      // Unpause
      if(isHost){
        globalPaused=false;
        const umsg=JSON.stringify({type:'unpaused'});
        conns.forEach(c=>{if(c.open)c.send(umsg);});
        applyGlobalPause(false);
      }else{
        if(conn&&conn.open)conn.send(JSON.stringify({type:'unpauseReq'}));
        // Optimistic: apply unpause locally immediately (server will confirm)
        globalPaused=false;
        applyGlobalPause(false);
      }
    }else{
      // Pause request
      if(isHost){
        if(onlinePauseCounts[0]>0){
          onlinePauseCounts[0]--;globalPaused=true;
          const pmsg=JSON.stringify({type:'paused',byPlayer:0,pauseCounts:onlinePauseCounts});
          conns.forEach(c=>{if(c.open)c.send(pmsg);});
          applyGlobalPause(true,0);
        }
      }else{
        if(onlinePauseCounts[myIndex]>0&&conn&&conn.open){
          conn.send(JSON.stringify({type:'pauseReq'}));
          // Optimistic: apply pause locally immediately (server will confirm)
          onlinePauseCounts[myIndex]--;
          globalPaused=true;
          applyGlobalPause(true,myIndex);
          updatePauseInfo();
        }
      }
    }
  }else{
    // Solo / Local: determine unified target pause state
    const shouldPause=boards.some(b=>!b.gameOver&&!b.paused);
    boards.forEach(b=>{if(!b.gameOver)b.setPause(shouldPause);});
    $btnPause.textContent=shouldPause?'Resume':'Pause';
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   SAVE & LOAD
   ═══════════════════════════════════════════════════════════════════════ */
function saveAndQuit(){
  if(mode==='solo'){
    const data=[boards[0].toSave()];
    localStorage.setItem('tetris-saga-solo',JSON.stringify(data));
  }else if(mode==='local'){
    const data=boards.map(b=>b.toSave());
    localStorage.setItem('tetris-saga-local',JSON.stringify(data));
  }
  backToMenu();
}

function loadGame(m){
  const raw=localStorage.getItem('tetris-saga-'+m);
  if(!raw)return;
  const data=JSON.parse(raw);
  localStorage.removeItem('tetris-saga-'+m);
  startGame(m,data);
}

function deleteAllSaves(){
  localStorage.removeItem('tetris-saga-solo');
  localStorage.removeItem('tetris-saga-local');
  checkSavedGames();
}

function checkSavedGames(){
  const hasSolo=!!localStorage.getItem('tetris-saga-solo');
  const hasLocal=!!localStorage.getItem('tetris-saga-local');
  const any=hasSolo||hasLocal;
  document.getElementById('saveSep').style.display=any?'block':'none';
  document.getElementById('btnContSolo').style.display=hasSolo?'inline-block':'none';
  document.getElementById('btnContLocal').style.display=hasLocal?'inline-block':'none';
  document.getElementById('btnDelSaves').style.display=any?'inline-block':'none';
}

/* ═══════════════════════════════════════════════════════════════════════
   NAV
   ═══════════════════════════════════════════════════════════════════════ */
function cleanupPeer(){
  if(joinTimeoutId){clearTimeout(joinTimeoutId);joinTimeoutId=null;}
  if(syncInterval){clearInterval(syncInterval);syncInterval=null;}
  isJoining=false;joinerPeerId=null;_retryScheduled=false;
  pendingJoinConns.forEach(c=>{try{c.close();}catch(e){}});pendingJoinConns=[];
  conns.forEach(c=>{try{c.close();}catch(e){}});conns=[];
  if(conn){try{conn.close();}catch(e){}}conn=null;
  if(peer){try{peer.removeAllListeners();peer.destroy();}catch(e){}}peer=null;

document.addEventListener('keydown',e=>{
  if(!boards.length)return;

  if(e.key==='p'||e.key==='P'){uiTogglePause();e.preventDefault();return;}

  if(mode==='solo'){
    const b=boards[0];if(b.gameOver||b.paused)return;
    switch(e.key){
      case'ArrowLeft':b.move(-1,0);break;case'ArrowRight':b.move(1,0);break;
      case'ArrowDown':b.move(0,1);break;case'ArrowUp':b.rotatePiece(1);break;
      case'z':case'Z':b.rotatePiece(-1);break;case' ':b.hardDrop();break;default:return;
    }
  }else if(mode==='local'){
    const b1=boards[0];
    if(!b1.gameOver&&!b1.paused){
      switch(e.key){
        case'a':case'A':b1.move(-1,0);break;case'd':case'D':b1.move(1,0);break;
        case's':case'S':b1.move(0,1);break;case'w':case'W':b1.rotatePiece(1);break;
        case'q':case'Q':b1.rotatePiece(-1);break;case'e':case'E':b1.hardDrop();break;
      }
    }
    const b2=boards[1];
    if(!b2.gameOver&&!b2.paused){
      switch(e.key){
        case'ArrowLeft':b2.move(-1,0);break;case'ArrowRight':b2.move(1,0);break;
        case'ArrowDown':b2.move(0,1);break;case'ArrowUp':b2.rotatePiece(1);break;
        case'/':b2.rotatePiece(-1);break;case'Enter':b2.hardDrop();break;
      }
    }
  }else if(mode==='online'){
    if(!myBoard||myBoard.gameOver||myBoard.paused)return;
    switch(e.key){
      case'ArrowLeft':myBoard.move(-1,0);break;case'ArrowRight':myBoard.move(1,0);break;
      case'ArrowDown':myBoard.move(0,1);break;case'ArrowUp':myBoard.rotatePiece(1);break;
      case'z':case'Z':myBoard.rotatePiece(-1);break;case' ':myBoard.hardDrop();break;default:return;
    }
  }
  e.preventDefault();
});

const bgCv=document.getElementById('bgCanvas');
const bgCtx=bgCv.getContext('2d');
let bgRafId=null,bgVisible=true;

const TETROMINOES=[
  {blocks:[[0,0],[1,0],[2,0],[3,0]],color:'#00d4ff'},
  {blocks:[[0,0],[1,0],[0,1],[1,1]],color:'#ffd700'},
  {blocks:[[0,0],[1,0],[2,0],[1,1]],color:'#b44dff'},
  {blocks:[[1,0],[2,0],[0,1],[1,1]],color:'#00e676'},
  {blocks:[[0,0],[1,0],[1,1],[2,1]],color:'#ff2d55'},
  {blocks:[[0,0],[0,1],[1,1],[2,1]],color:'#2979ff'},
  {blocks:[[2,0],[0,1],[1,1],[2,1]],color:'#ff9100'},
];
let floaters=[];
function spawnFloater(){
  const t=TETROMINOES[Math.floor(Math.random()*TETROMINOES.length)];
  const sz=Math.random()*14+10;
  floaters.push({blocks:t.blocks,color:t.color,x:Math.random()*bgCv.width,y:-sz*4,
    speed:Math.random()*0.6+0.2,rot:Math.random()*Math.PI*2,rotSpeed:(Math.random()-0.5)*0.01,
    alpha:Math.random()*0.15+0.05,size:sz});
}

function drawGrid(){
  bgCtx.strokeStyle='rgba(255,255,255,0.025)';bgCtx.lineWidth=0.5;
  for(let x=0;x<bgCv.width;x+=30){bgCtx.beginPath();bgCtx.moveTo(x,0);bgCtx.lineTo(x,bgCv.height);bgCtx.stroke();}
  for(let y=0;y<bgCv.height;y+=30){bgCtx.beginPath();bgCtx.moveTo(0,y);bgCtx.lineTo(bgCv.width,y);bgCtx.stroke();}
}

function bgLoop(){
  bgCv.width=window.innerWidth;bgCv.height=window.innerHeight;
  const g=bgCtx.createRadialGradient(bgCv.width/2,bgCv.height*0.4,0,bgCv.width/2,bgCv.height*0.4,bgCv.width*0.75);
  g.addColorStop(0,'#0e1628');g.addColorStop(1,'#0a0a1a');
  bgCtx.fillStyle=g;bgCtx.fillRect(0,0,bgCv.width,bgCv.height);
  drawGrid();
  if(Math.random()<0.03)spawnFloater();
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i];f.y+=f.speed;f.rot+=f.rotSpeed;
    bgCtx.save();bgCtx.translate(f.x,f.y);bgCtx.rotate(f.rot);bgCtx.globalAlpha=f.alpha;bgCtx.fillStyle=f.color;
    f.blocks.forEach(([bx,by])=>{bgCtx.fillRect(bx*f.size,by*f.size,f.size-1,f.size-1);});
    bgCtx.restore();
    if(f.y>bgCv.height+60)floaters.splice(i,1);
  }
  bgRafId=requestAnimationFrame(bgLoop);
}

function bgStart(){bgVisible=true;bgCv.style.opacity='1';if(!bgRafId)bgLoop();}
function bgFade(){bgCv.style.transition='opacity 0.5s';bgCv.style.opacity='0.15';}
bgStart();

/* ═══════════════════════════════════════════════════════════════════════
   TEST 1: STUN Connectivity + Symmetric NAT Detection
   Checks multiple STUN servers, collects public IPs, and flags symmetric NAT
   if different servers return different IPs (different external mapping per dest).
   ═══════════════════════════════════════════════════════════════════════ */
let _diagStunIPs=[];  // collected for summary
async function runDiagStun(){
  _btnState('diagBtnStun','running');
  dlog('--- STUN TEST ---','info');
  const stunServers=['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302','stun:stun2.l.google.com:19302','stun:global.stun.twilio.com:3478'];
  let anyOk=false;
  _diagStunIPs=[];
  for(const url of stunServers){
    try{
      dlog('Testing '+url+'...','dim');
      const result=await _testOneStun(url,5000);
      if(result){dlog('  '+url+' -> '+result,'ok');anyOk=true;_diagStunIPs.push(result);}
      else{dlog('  '+url+' -> no candidate','warn');}
    }catch(e){dlog('  '+url+' -> error: '+e.message,'err');}
  }
  // Symmetric NAT detection: if we got IPs from multiple servers, compare them
  const uniqueIPs=[...new Set(_diagStunIPs)];
  if(uniqueIPs.length>1){
    dlog('WARNING: Different public IPs from different STUN servers: '+uniqueIPs.join(', '),'err');
    dlog('This strongly indicates SYMMETRIC NAT. Each outbound connection gets a different external IP/port mapping.','err');
    dlog('STUN-only P2P connections will FAIL. A working TURN relay is REQUIRED.','err');
  }else if(uniqueIPs.length===1){
    dlog('Consistent public IP: '+uniqueIPs[0]+' (NAT is likely cone-type, P2P-friendly)','ok');
  }
  if(anyOk){dlog('STUN: PASS - At least one server reachable','ok');_btnState('diagBtnStun','pass');}
  else{dlog('STUN: FAIL - No STUN server returned a candidate. You may be behind a restrictive firewall.','err');_btnState('diagBtnStun','fail');}
  return anyOk;
}

function _testOneStun(url,timeout){
  return new Promise((resolve,reject)=>{
    let done=false;
    const pc=new RTCPeerConnection({iceServers:[{urls:url}]});
    const timer=setTimeout(()=>{if(!done){done=true;pc.close();resolve(null);}},timeout);
    pc.onicecandidate=(e)=>{
      if(done)return;
      if(e.candidate&&e.candidate.candidate){
        const m=e.candidate.candidate.match(/([0-9]{1,3}(\.[0-9]{1,3}){3})/);
        if(m&&!m[1].startsWith('10.')&&!m[1].startsWith('192.168.')&&!m[1].startsWith('172.')){
          done=true;clearTimeout(timer);pc.close();resolve(m[1]);
        }
      }
    };
    pc.onicegatheringstatechange=()=>{
      if(pc.iceGatheringState==='complete'&&!done){done=true;clearTimeout(timer);pc.close();resolve(null);}
    };
    pc.createDataChannel('test');
    pc.createOffer().then(o=>pc.setLocalDescription(o)).catch(e=>{if(!done){done=true;clearTimeout(timer);pc.close();reject(e);}});
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   TEST 2: TURN Connectivity
   Verifies TURN relay servers accept credentials and return relay candidates.
   ═══════════════════════════════════════════════════════════════════════ */
async function runDiagTurn(){
  _btnState('diagBtnTurn','running');
  dlog('--- TURN TEST ---','info');
  const turnServers=ICE_CONFIG.iceServers.filter(s=>s.urls&&(s.urls.startsWith('turn:')||s.urls.startsWith('turns:')));
  if(turnServers.length===0){dlog('No TURN servers configured.','warn');_btnState('diagBtnTurn','fail');return false;}
  let anyOk=false;
  for(const srv of turnServers){
    try{
      dlog('Testing '+srv.urls+' (user: '+(srv.username||'none')+')...','dim');
      const result=await _testOneTurn(srv,8000);
      if(result){dlog('  '+srv.urls+' -> relay candidate obtained','ok');anyOk=true;}
      else{dlog('  '+srv.urls+' -> no relay candidate (credentials may be expired or server unreachable)','warn');}
    }catch(e){dlog('  '+srv.urls+' -> error: '+e.message,'err');}
  }
  if(anyOk){dlog('TURN: PASS - Relay available','ok');_btnState('diagBtnTurn','pass');}
  else{
    dlog('TURN: FAIL - No TURN relay candidate obtained.','err');
    const uniqueIPs=[...new Set(_diagStunIPs||[])];
    if(uniqueIPs.length>1){
      dlog('CRITICAL: You have symmetric NAT AND no working TURN relay. P2P connections will FAIL.','err');
      dlog('Fix: Get fresh TURN credentials from https://www.metered.ca/stun-turn (free tier) or https://www.expressturn.com','err');
    }else{
      dlog('Direct P2P may still work via STUN if both peers have cone-type NAT.','warn');
    }
    _btnState('diagBtnTurn','fail');
  }
  return anyOk;
}

function _testOneTurn(srv,timeout){
  return new Promise((resolve)=>{
    let done=false;let gotRelay=false;
    const pc=new RTCPeerConnection({iceServers:[srv],iceTransportPolicy:'relay'});
    const timer=setTimeout(()=>{if(!done){done=true;pc.close();resolve(false);}},timeout);
    pc.onicecandidate=(e)=>{
      if(done)return;
      if(e.candidate&&e.candidate.candidate&&e.candidate.candidate.indexOf('relay')!==-1){
        gotRelay=true;done=true;clearTimeout(timer);pc.close();resolve(true);
      }
    };
    pc.onicegatheringstatechange=()=>{
      if(pc.iceGatheringState==='complete'&&!done){done=true;clearTimeout(timer);pc.close();resolve(gotRelay);}
    };
    pc.createDataChannel('test');
    pc.createOffer().then(o=>pc.setLocalDescription(o)).catch(()=>{if(!done){done=true;clearTimeout(timer);pc.close();resolve(false);}});
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   TEST 3: PeerJS Signaling Server
   Tests if the PeerJS cloud signaling server is reachable and can register an ID.
   ═══════════════════════════════════════════════════════════════════════ */
async function runDiagSignal(){
  _btnState('diagBtnSignal','running');
  dlog('--- PEERJS SIGNALING TEST ---','info');
  const testId='diag-'+Math.random().toString(36).substr(2,10);
  dlog('Registering test peer ID: '+testId+'...','dim');
  return new Promise((resolve)=>{
    const timer=setTimeout(()=>{
      dlog('PeerJS signaling: TIMEOUT after 10s. The signaling server (0.peerjs.com) may be down or blocked by your network.','err');
      _btnState('diagBtnSignal','fail');
      try{tp.destroy();}catch(e){}
      resolve(false);
    },10000);
    const tp=new Peer(testId,{config:ICE_CONFIG});
    tp.on('open',(id)=>{
      clearTimeout(timer);
      dlog('Registered with PeerJS as: '+id,'ok');
      dlog('Signaling server: 0.peerjs.com:443 (wss)','ok');
      // Check WebSocket state
      try{
        const sock=tp._socket&&tp._socket._socket;
        dlog('WebSocket readyState: '+(sock?sock.readyState:'N/A'),'dim');
      }catch(e){}
      dlog('PeerJS Signaling: PASS','ok');
      _btnState('diagBtnSignal','pass');
      tp.destroy();
      resolve(true);
    });
    tp.on('error',(err)=>{
      clearTimeout(timer);
      dlog('PeerJS error: type='+err.type+' msg='+(err.message||''),'err');
      if(err.type==='unavailable-id'){
        dlog('ID collision (extremely unlikely for random ID). Signaling server IS reachable.','warn');
        dlog('PeerJS Signaling: PASS (with ID collision)','ok');
        _btnState('diagBtnSignal','pass');
        resolve(true);
      }else if(err.type==='network'){
        dlog('PeerJS Signaling: FAIL - Network error. Check if wss://0.peerjs.com:443 is reachable. Corporate firewalls or proxies may block WebSocket connections.','err');
        _btnState('diagBtnSignal','fail');
        resolve(false);
      }else if(err.type==='server-error'){
        dlog('PeerJS Signaling: FAIL - Server error. The free PeerJS cloud server may be overloaded.','err');
        _btnState('diagBtnSignal','fail');
        resolve(false);
      }else{
        dlog('PeerJS Signaling: FAIL - '+err.type,'err');
        _btnState('diagBtnSignal','fail');
        resolve(false);
      }
      try{tp.destroy();}catch(e){}
    });
    tp.on('disconnected',()=>{dlog('PeerJS: disconnected event fired','warn');});
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   TEST 4: WebRTC Data Channel (loopback)
   Creates two local RTCPeerConnections and tests a data channel between them.
   This proves the browser supports WebRTC data channels end-to-end.
   ═══════════════════════════════════════════════════════════════════════ */
async function runDiagWebRTC(){
  _btnState('diagBtnWebRTC','running');
  dlog('--- WEBRTC DATA CHANNEL TEST ---','info');
  dlog('Creating local loopback peer connection...','dim');
  return new Promise((resolve)=>{
    const timer=setTimeout(()=>{
      dlog('WebRTC loopback: TIMEOUT after 8s. This is unexpected for a local test.','err');
      _btnState('diagBtnWebRTC','fail');
      try{pc1.close();pc2.close();}catch(e){}
      resolve(false);
    },8000);

    const pc1=new RTCPeerConnection({iceServers:[]});
    const pc2=new RTCPeerConnection({iceServers:[]});

    pc1.onicecandidate=(e)=>{if(e.candidate)pc2.addIceCandidate(e.candidate).catch(()=>{});};
    pc2.onicecandidate=(e)=>{if(e.candidate)pc1.addIceCandidate(e.candidate).catch(()=>{});};

    const dc=pc1.createDataChannel('diagTest');
    const testMsg='DIAG_PING_'+Date.now();

    pc2.ondatachannel=(e)=>{
      const rc=e.channel;
      rc.onmessage=(ev)=>{
        if(ev.data===testMsg){
          clearTimeout(timer);
          dlog('Received loopback message: "'+ev.data+'"','ok');
          dlog('WebRTC Data Channel: PASS','ok');
          _btnState('diagBtnWebRTC','pass');
          pc1.close();pc2.close();
          resolve(true);
        }
      };
      rc.onopen=()=>{dlog('Remote data channel opened','dim');};
    };

    dc.onopen=()=>{
      dlog('Local data channel opened, sending test message...','dim');
      dc.send(testMsg);
    };
    dc.onerror=(e)=>{
      clearTimeout(timer);
      dlog('Data channel error: '+(e.error||e),'err');
      dlog('WebRTC Data Channel: FAIL','err');
      _btnState('diagBtnWebRTC','fail');
      pc1.close();pc2.close();
      resolve(false);
    };

    pc1.createOffer().then(o=>{
      dlog('SDP offer created (type: '+o.type+', length: '+o.sdp.length+')','dim');
      return pc1.setLocalDescription(o);
    }).then(()=>pc2.setRemoteDescription(pc1.localDescription))
      .then(()=>pc2.createAnswer())
      .then(a=>{
        dlog('SDP answer created','dim');
        return pc2.setLocalDescription(a);
      })
      .then(()=>pc1.setRemoteDescription(pc2.localDescription))
      .catch(e=>{
        clearTimeout(timer);
        dlog('SDP negotiation error: '+e.message,'err');
        dlog('WebRTC Data Channel: FAIL','err');
        _btnState('diagBtnWebRTC','fail');
        pc1.close();pc2.close();
        resolve(false);
      });
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   RUN ALL TESTS (sequential)
   ═══════════════════════════════════════════════════════════════════════ */
async function runAllDiag(){
  _btnState('diagBtnAll','running');
  dlog('========== FULL DIAGNOSTICS ==========','info');

  // Browser info
  dlog('Browser: '+navigator.userAgent,'dim');
  dlog('Platform: '+navigator.platform,'dim');

  dlog('PeerJS loaded: '+(typeof Peer!=='undefined'?'YES (v'+(Peer.prototype&&Peer.prototype.constructor?'loaded':'?')+')':'NO'),'dim');
  dlog('');

  const r1=await runDiagStun();
  dlog('');
  const r2=await runDiagTurn();
  dlog('');
  const r3=await runDiagSignal();
  dlog('');
  const r4=await runDiagWebRTC();
  dlog('');

  dlog('========== SUMMARY ==========','info');
  dlog('STUN:            '+(r1?'PASS':'FAIL'), r1?'ok':'err');
  dlog('TURN:            '+(r2?'PASS':'FAIL'), r2?'ok':'err');
  dlog('PeerJS Signaling:'+(r3?'PASS':'FAIL'), r3?'ok':'err');
  dlog('WebRTC Channel:  '+(r4?'PASS':'FAIL'), r4?'ok':'err');

  // Symmetric NAT verdict
  const uniqueIPs=[...new Set(_diagStunIPs||[])];
  if(uniqueIPs.length>1){
    dlog('NAT Type:         SYMMETRIC (detected '+uniqueIPs.length+' different public IPs)','err');
  }else if(uniqueIPs.length===1){
    dlog('NAT Type:         Cone (single public IP: '+uniqueIPs[0]+')','ok');
  }

  if(r1&&r2&&r3&&r4){
    dlog('All tests passed. If connecting still fails, the issue may be on the remote peer side, or the room code is wrong.','ok');
    _btnState('diagBtnAll','pass');
  }else if(r3&&r4&&r1&&!r2){
    if(uniqueIPs.length>1){
      dlog('DIAGNOSIS: Symmetric NAT detected + TURN relay unavailable. This is the root cause.','err');
      dlog('Symmetric NAT assigns a different external port per destination, so STUN-discovered addresses are useless for P2P.','err');
      dlog('FIX: A working TURN relay is required. Get fresh credentials from https://www.metered.ca/stun-turn (free tier) and update ICE_CONFIG.','err');
    }else{
      dlog('TURN relay unavailable, but NAT appears cone-type. Direct P2P should work unless the OTHER player also has restrictive NAT.','warn');
    }
    _btnState('diagBtnAll','warn'in{}?'warn':'pass');
  }else{
    dlog('One or more critical tests failed. See details above.','err');
    if(!r3)dlog('  -> PeerJS signaling failure is the most likely cause of "stuck on Connecting". Check firewall/proxy settings for wss://0.peerjs.com:443','err');
    if(!r1&&!r2)dlog('  -> No ICE servers reachable. You may be behind a very restrictive firewall or VPN.','err');
    if(!r4)dlog('  -> WebRTC not functional in this browser. Try Chrome or Edge.','err');
    _btnState('diagBtnAll','fail');
  }
  dlog('====================================','info');
}

/* ═══════════════════════════════════════════════════════════════════════
   LIVE CONNECTION EVENT LOGGER
   Hooks into the join/host flow to log events in real-time.
   ═══════════════════════════════════════════════════════════════════════ */
// Wrap _attemptJoin to add logging
const _origAttemptJoin=_attemptJoin;
_attemptJoin=function(code){
  dlog('[JOIN] Attempt #'+joinRetries+' for room code: '+code,'info');
  dlog('[JOIN] Peer ID: '+(joinerPeerId||'generating...'),'dim');
  dlog('[JOIN] Trying '+HOST_PEER_COUNT+' host endpoints in parallel...','dim');
  return _origAttemptJoin.call(this,code);
};

// Wrap createRoom to add logging
const _origCreateRoom=createRoom;
createRoom=function(){
  dlog('[HOST] Creating room...','info');
  _origCreateRoom.call(this);
  dlog('[HOST] Room code: '+createRoomCode+', registering '+HOST_PEER_COUNT+' peer endpoints','dim');
};

// Wrap handlePlayerDisconnect to add logging
const _origHandlePlayerDisconnect=handlePlayerDisconnect;
handlePlayerDisconnect=function(idx){
  dlog('[NET] Player disconnect: idx='+idx+' mode='+mode+' isHost='+isHost,'warn');
  return _origHandlePlayerDisconnect.call(this,idx);
};

// Wrap handleJoinerData to log incoming messages
const _origHandleJoinerData=handleJoinerData;
handleJoinerData=function(raw){
  try{const m=JSON.parse(raw);dlog('[JOINER-RX] '+m.type+(m.playerIndex!==undefined?' idx='+m.playerIndex:'')+(m.totalPlayers!==undefined?' total='+m.totalPlayers:''),'dim');}catch(e){}
  return _origHandleJoinerData.call(this,raw);
};

// Wrap handleHostData to log incoming messages
const _origHandleHostData=handleHostData;
handleHostData=function(raw,fromConn){
  try{const m=JSON.parse(raw);if(m.type!=='state')dlog('[HOST-RX] '+m.type+' from idx='+(fromConn._playerIndex),'dim');}catch(e){}
  return _origHandleHostData.call(this,raw,fromConn);
};
